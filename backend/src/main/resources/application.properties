spring.application.name=khorasan
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/khorasan?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:khorasan}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jackson.time-zone=Asia/Kabul
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}

server.address=${SERVER_ADDRESS:127.0.0.1}
