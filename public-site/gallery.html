<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر | مدیریت جامع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .gallery-filter {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            border: none;
            background: #f1f5f9;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #2563eb;
            color: white;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: 0.5s;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 1rem;
            transition: 0.3s;
        }
        .gallery-item:hover .gallery-overlay {
            bottom: 0;
        }
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 1rem;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
   // Navigation
    <div id="shared-navbar"></div>

    <section class="bg-primary text-white py-5">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">گالری تصاویر</h1>
            <p class="lead">تصاویر محصولات، رویدادها و فعالیت‌های شرکت</p>
        </div>
    </section>

    <div class="container py-5">
        <div class="gallery-filter">
            <button class="filter-btn active" data-filter="all">همه</button>
            <button class="filter-btn" data-filter="products">محصولات</button>
            <button class="filter-btn" data-filter="events">رویدادها</button>
            <button class="filter-btn" data-filter="office">دفتر شرکت</button>
        </div>
        
        <div class="row" id="galleryGrid">
            <!-- توسط JS پر می‌شود -->
        </div>
  </head>
  <body data-page="gallery">
    <header id="public-header" class="public-nav"></header>
    <main class="public-main" id="public-app">
      <p>در حال دریافت معلومات…</p>
    </main>
    <footer id="public-footer" class="public-footer"></footer>
    <script type="module" src="../assets/js/public.js"></script>
  </body>
</html>
