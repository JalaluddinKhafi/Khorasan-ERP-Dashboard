<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما | مدیریت جامع</title>
    <meta name="description" content="ارتباط با تیم پشتیبانی و فروش مدیریت جامع">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .contact-info-card {
            text-align: center;
            padding: 2rem;
            background: #f8fafc;
            border-radius: 1rem;
            transition: 0.3s;
            height: 100%;
        }
        .contact-info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .contact-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .contact-icon i {
            font-size: 2rem;
            color: white;
        }
        .map-container {
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="shared-navbar"></div>

    <section class="bg-primary text-white py-5">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">تماس با ما</h1>
            <p class="lead">ما همواره آماده پاسخگویی به شما هستیم</p>
        </div>
    </section>

    <div class="container py-5">
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="contact-info-card">
                    <div class="contact-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h5>آدرس</h5>
                    <p class="text-muted mb-0">تهران، خیابان ولیعصر، پلاک ۱۲۳<br>ساختمان مدیریت جامع</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="contact-info-card">
                    <div class="contact-icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <h5>تلفن تماس</h5>
                    <p class="text-muted mb-0">۰۲۱-۱۲۳۴۵۶۷۸<br>۰۲۱-۸۷۶۵۴۳۲۱</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="contact-info-card">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h5>ایمیل</h5>
                    <p class="text-muted mb-0">info@armanmanagement.com<br>support@armanmanagement.com</p>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="mb-4">فرم تماس</h4>
                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">نام و نام خانوادگی</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ایمیل</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">شماره تماس</label>
                                <input type="tel" class="form-control" name="phone" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">موضوع</label>
                                <select class="form-select" name="subject">
                                    <option>درخواست مشاوره</option>
                                    <option>پشتیبانی محصولات</option>
                                    <option>همکاری و فروش</option>
                                    <option>سایر موارد</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">پیام شما</label>
                                <textarea class="form-control" rows="5" name="message" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">ارسال پیام</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
    <header id="public-header" class="public-nav"></header>
    <main class="public-main" id="public-app">
      <p>در حال دریافت معلومات…</p>
    </main>
    <footer id="public-footer" class="public-footer"></footer>
    <script type="module" src="../assets/js/public.js"></script>
  </body>
</html>
