<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوالات متداول | نمایندگی رسمی</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .faq-section {
            max-width: 800px;
            margin: 0 auto;
        }
        .accordion-button:not(.collapsed) {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
        }
        .category-badge {
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-badge:hover, .category-badge.active {
            background: #2563eb !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="shared-navbar"></div>

    <section class="bg-primary text-white py-5">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">سوالات متداول</h1>
            <p class="lead">پاسخ به سوالات رایج شما</p>
        </div>
    </section>

    <div class="container py-5">
        <div class="faq-section">
            <div class="text-center mb-4">
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <span class="badge bg-secondary category-badge px-3 py-2 active" data-category="all">همه</span>
                    <span class="badge bg-secondary category-badge px-3 py-2" data-category="general">عمومی</span>
                    <span class="badge bg-secondary category-badge px-3 py-2" data-category="technical">فنی</span>
                    <span class="badge bg-secondary category-badge px-3 py-2" data-category="financial">مالی</span>
                </div>
            </div>
            
            <div class="accordion" id="faqAccordion">
      content="امینی گروپ؛ اجناس، نرخ‌ها، خدمات و ارتباط با شرکت."
    />
    <title>پرسش‌های متداول | امینی گروپ</title>
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/app.css" />
  </head>
  <body data-page="faq">
    <header id="public-header" class="public-nav"></header>
    <main class="public-main" id="public-app">
      <p>در حال دریافت معلومات…</p>
    </main>
    <footer id="public-footer" class="public-footer"></footer>
    <script type="module" src="../assets/js/public.js"></script>
  </body>
</html>
