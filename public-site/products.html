                            <p id="modalProductDesc"></p>
                            <ul class="list-unstyled">
                                <li><i class="fas fa-tag me-2"></i> <strong>دسته:</strong> <span id="modalProductCat"></span></li>
                                <li><i class="fas fa-check-circle text-success me-2"></i> موجود در انبار</li>
                            </ul>
                            <button class="btn btn-primary btn-lg w-100 mt-3">تماس برای خرید</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white-50 py-4 mt-5">
        <div class="container text-center">
            <p>&copy; ۱۴۰۲ تمامی حقوق محفوظ است.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // داده‌های محصولات
        const products = [
            { id: 1, name: "لپ تاپ ایسوس ROG Zephyrus", category: "laptop", price: 35500000, oldPrice: 38900000, image: "https://via.placeholder.com/300x200/2563eb/white?text=ASUS+ROG", desc: "پردازنده Intel Core i9-13900H، رم 32GB، حافظه 1TB SSD، نمایشگر 240Hz" },
            { id: 2, name: "لپ تاپ لنوو Legion 5", category: "laptop", price: 28900000, oldPrice: 32500000, image: "https://via.placeholder.com/300x200/10b981/white?text=Lenovo+Legion", desc: "پردازنده AMD Ryzen 7، رم 16GB، RTX 3060" },
            { id: 3, name: "گوشی سامسونگ Galaxy S24 Ultra", category: "phone", price: 42000000, oldPrice: 45900000, image: "https://via.placeholder.com/300x200/f59e0b/white?text=Samsung+S24", desc: "دوربین 200 مگاپیکسل، 12GB رم، 512GB حافظه" },
            { id: 4, name: "گوشی آیفون 15 Pro Max", category: "phone", price: 68900000, oldPrice: 72900000, image: "https://via.placeholder.com/300x200/ef4444/white?text=iPhone+15", desc: "تراشه A17 Pro، 256GB، دوربین 48 مگاپیکسل" },
            { id: 5, name: "هدفون سونی WH-1000XM5", category: "audio", price: 8900000, oldPrice: 10900000, image: "https://via.placeholder.com/300x200/8b5cf6/white?text=Sony+XM5", desc: "حذف نویز فعال، عمر باتری 30 ساعت" },
            { id: 6, name: "هدفون اپل AirPods Pro 2", category: "audio", price: 12500000, oldPrice: 14900000, image: "https://via.placeholder.com/300x200/06b6d4/white?text=AirPods+Pro", desc: "کیفیت صدای فوق العاده، مقاوم در برابر آب" }
        ];
        
        let currentProducts = [...products];
        
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            
            grid.innerHTML = currentProducts.map(p => `
                <div class="col-md-6 col-lg-4">
                    <div class="product-card card h-100">
                        <img src="${p.image}" class="product-img card-img-top" alt="${p.name}">
                        <div class="card-body">
                            <h5 class="card-title">${p.name}</h5>
                            <p class="card-text text-muted small">${p.desc.substring(0, 80)}...</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div>
                                    <span class="price">${p.price.toLocaleString()} تومان</span>
                                    ${p.oldPrice ? `<div class="old-price">${p.oldPrice.toLocaleString()} تومان</div>` : ''}
                                </div>
                                <button class="btn btn-outline-primary btn-sm view-product" data-id="${p.id}">
                                    <i class="fas fa-eye"></i> جزئیات
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // رویداد مشاهده جزئیات
            document.querySelectorAll('.view-product').forEach(btn => {
                btn.addEventListener('click', () => showProductDetails(parseInt(btn.dataset.id)));
            });
        }
        
        function showProductDetails(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            document.getElementById('modalProductName').innerText = product.name;
            document.getElementById('modalProductImage').src = product.image;
            document.getElementById('modalProductPrice').innerHTML = `${product.price.toLocaleString()} تومان`;
            document.getElementById('modalProductDesc').innerText = product.desc;
            document.getElementById('modalProductCat').innerText = getCategoryName(product.category);
            
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }
        
        function getCategoryName(cat) {
            const categories = { laptop: 'لپ تاپ', phone: 'گوشی موبایل', audio: 'هدفون' };
            return categories[cat] || cat;
        }
        
        function filterProducts() {
            const searchTerm = document.getElementById('searchProduct').value.toLowerCase();
            const selectedCategory = document.querySelector('input[name="category"]:checked').value;
            const priceLimit = parseInt(document.getElementById('priceRange').value);
            
            currentProducts = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchTerm);
                const matchCategory = selectedCategory === 'all' || p.category === selectedCategory;
                const matchPrice = p.price <= priceLimit;
                return matchSearch && matchCategory && matchPrice;
            });
            
            renderProducts();
        }
        
        document.getElementById('searchProduct')?.addEventListener('input', filterProducts);
        document.querySelectorAll('.category-filter').forEach(radio => {
            radio.addEventListener('change', filterProducts);
        });
        document.getElementById('priceRange')?.addEventListener('input', (e) => {
            document.getElementById('priceValue').innerText = `${parseInt(e.target.value).toLocaleString()} تومان`;
            filterProducts();
        });
        document.getElementById('resetFilters')?.addEventListener('click', () => {
            document.getElementById('searchProduct').value = '';
            document.getElementById('allCat').checked = true;
            document.getElementById('priceRange').value = 50000000;
            document.getElementById('priceValue').innerText = '۵۰ میلیون تومان';
            currentProducts = [...products];
            renderProducts();
        });
        
        renderProducts();
    </script>
</body>
</html>
