<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات مقاله | مدیریت جامع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .article-content {
            line-height: 1.8;
            font-size: 1.05rem;
        }
        .article-content h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .article-content p {
            margin-bottom: 1.25rem;
            color: #334155;
        }
        .share-buttons .btn {
            border-radius: 2rem;
            margin: 0.25rem;
        }
        .comment-section {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 2rem;
            margin-top: 2rem;
        }
        .comment {
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
        }
        .comment:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="shared-navbar"></div>
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div id="articleContent">
                    <!-- محتوای مقاله توسط JS لود می‌شود -->
                </div>
                
                <div class="share-buttons text-center mt-4">
                    <span class="me-2">اشتراک گذاری:</span>
                    <button class="btn btn-primary btn-sm"><i class="fab fa-telegram"></i> تلگرام</button>
                    <button class="btn btn-info btn-sm text-white"><i class="fab fa-twitter"></i> توییتر</button>
                    <button class="btn btn-success btn-sm"><i class="fab fa-whatsapp"></i> واتساپ</button>
                </div>
                
                <!-- Comments Section -->
                <div class="comment-section">
                    <h4>نظرات (۳)</h4>
                    <div id="commentsList">
                        <div class="comment">
                            <strong>رضا محمدی</strong>
                            <small class="text-muted">۱۴۰۲/۱۲/۰۵</small>
                            <p class="mt-2 mb-0">مقاله بسیار مفیدی بود. ممنون از تیم مدیریت جامع</p>
                        </div>
                        <div class="comment">
                            <strong>سارا کریمی</strong>
                            <small class="text-muted">۱۴۰۲/۱۲/۰۴</small>
                            <p class="mt-2 mb-0">لطفاً مقالات بیشتری در این زمینه منتشر کنید</p>
                        </div>
                    </div>
                    
                    <h5 class="mt-4">ارسال نظر</h5>
                    <form id="commentForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="نام شما" required>
  <body data-page="blog-details">
    <header id="public-header" class="public-nav"></header>
    <main class="public-main" id="public-app">
      <p>در حال دریافت معلومات…</p>
    </main>
    <footer id="public-footer" class="public-footer"></footer>
    <script type="module" src="../assets/js/public.js"></script>
  </body>
</html>
