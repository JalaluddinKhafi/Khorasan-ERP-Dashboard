                <div class="article-content">${post.content}</div>
            `;
        }
        
        document.getElementById('commentForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('نظر شما با موفقیت ثبت شد. پس از تایید نمایش داده می‌شود.');
