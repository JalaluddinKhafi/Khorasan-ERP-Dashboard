services:
  db:
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: khorasan
      MYSQL_USER: khorasan
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    restart: unless-stopped
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8082}:8080"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://db:3306/khorasan?characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: khorasan
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD with 12 or more characters}
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
