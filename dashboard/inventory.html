    <title>مدیریت انبار | داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .stock-card {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .warning-stock {
            background: #fff3cd;
            border-right: 4px solid #ffc107;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .badge-low {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Stock Summary Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stock-card">
                            <h3 class="mb-0" id="totalStockValue">۰</h3>
                            <small>ارزش کل موجودی</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stock-card" style="background: linear-gradient(135deg, #10b981, #059669);">
                            <h3 class="mb-0" id="totalItems">۰</h3>
                            <small>تعداد اقلام موجود</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stock-card" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                            <h3 class="mb-0" id="lowStockCount">۰</h3>
                            <small>محصولات کم موجود</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stock-card" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">
                            <h3 class="mb-0" id="outOfStockCount">۰</h3>
                            <small>محصولات ناموجود</small>
                        </div>
                    </div>
                </div>

                <!-- Low Stock Alert -->
                <div class="card mb-4">
                    <div class="card-header bg-warning text-dark">
                        <i class="fas fa-exclamation-triangle"></i> هشدار موجودی کم
                    </div>
                    <div class="card-body" id="lowStockAlert">
                        <!-- لیست محصولات کم موجود -->
                    </div>
                </div>

                <!-- Current Inventory Table -->
                <div class="card">
                    <div class="card-header">
                        <h5>موجودی فعلی انبار</h5>
                    </div>
                    <div class="card-body">
                        <table id="inventoryTable" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>کد کالا</th>
                                    <th>نام کالا</th>
                                    <th>دسته‌بندی</th>
                                    <th>موجودی فعلی</th>
                                    <th>حداقل موجودی</th>
                                    <th>وضعیت</th>
                                    <th>آخرین ورود</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Transaction History -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5>تاریخچه ورود و خروج کالا</h5>
                    </div>
                    <div class="card-body">
                        <table id="transactionTable" class="table">
                            <thead>
                                <tr><th>تاریخ</th><th>نوع</th><th>کالا</th><th>تعداد</th><th>مرجع</th><th>کاربر</th></tr>
                            </thead>
                            <tbody id="transactionTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
