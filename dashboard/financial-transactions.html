<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تراکنش‌های مالی | داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Summary Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-success"><i class="fas fa-arrow-down"></i></div>
                            <div class="stat-info">
                                <h3 id="totalIncome">۰</h3>
                                <p>کل ورودی‌ها</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-danger"><i class="fas fa-arrow-up"></i></div>
                            <div class="stat-info">
                                <h3 id="totalOutcome">۰</h3>
                                <p>کل خروجی‌ها</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary"><i class="fas fa-chart-line"></i></div>
                            <div class="stat-info">
                                <h3 id="netCashflowFinancial">۰</h3>
                                <p>جریان نقدی خالص</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-info"><i class="fas fa-percent"></i></div>
                            <div class="stat-info">
                                <h3 id="profitMargin">۰</h3>
                                <p>حاشیه سود</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>لیست تراکنش‌های مالی</h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <input type="text" id="searchTransaction" class="form-control" placeholder="جستجو...">
                                    </div>
                                    <div class="col-md-3">
                                        <select id="typeFilter" class="form-select">
                                            <option value="all">همه</option>
                                            <option value="income">ورودی</option>
                                            <option value="outcome">خروجی</option>
                                        </select>
                                    </div>
                                </div>
                                <table id="transactionsTable" class="table table-striped">
                                    <thead>
                                        <tr><th>تاریخ</th><th>نوع</th><th>عنوان</th><th>مبلغ</th><th>دسته‌بندی</th><th>وضعیت</th></tr>
                                    </thead>
                                    <tbody id="transactionsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>نمودار جریان نقدی ماهانه</h5>
                            </div>
                            <div class="card-body">
                                <div id="cashflowChart"></div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <h5>سود و زیان</h5>
                            </div>
                            <div class="card-body">
                                <div id="profitLossSummary"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        let transactionsData = [];
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
