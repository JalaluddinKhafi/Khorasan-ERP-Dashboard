    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        // ============================================
        // داده‌های نمونه رسیدها
        // ============================================
        let receiptsData = [
            {
                id: 1,
                receiptNumber: "1319",
                receiptDate: "1405/03/12",
                receiptTime: "07:10 PM",
                customerCode: "42",
                customerName: "آقای آریا",
                payerName: "نمایندگی قلعه نو حاجی قاسم",
                payerAddress: "قلعه نو",
                currency: "USD",
                exchangeRate: 166.5,
                exchangeAmount: 166.5,
                previousBalance: 0,
                demandAmount: 16666.462,
                discountAmount: 0,
                totalAmount: 166.5,
                amountInWords: "صد و شصت و هفت دلار",
                description: "بابت تخفیف فاکتور 450",
                status: "paid"
            },
            {
                id: 2,
                receiptNumber: "1320",
                receiptDate: "1405/03/10",
                receiptTime: "10:15 AM",
                customerCode: "42",
                customerName: "آقای آریا",
                payerName: "نمایندگی قلعه نو حاجی قاسم",
                payerAddress: "قلعه نو",
                currency: "USD",
                exchangeRate: 165.2,
                exchangeAmount: 500,
                previousBalance: 16666.462,
                demandAmount: 16166.462,
                discountAmount: 0,
                totalAmount: 500,
                amountInWords: "پانصد دلار",
                description: "پرداخت وجه فاکتورهای قبلی",
                status: "paid"
            }
        ];

        function renderReceipts() {
            const container = document.getElementById('receiptsList');
            if (!container) return;

            container.innerHTML = receiptsData.map(r => `
                <div class="col-md-6 col-lg-4">
                    <div class="receipt-card">
                        <div class="receipt-header">
                            <div class="d-flex justify-content-between">
                                <span><i class="fas fa-receipt"></i> رسید شماره ${r.receiptNumber}</span>
                                <span class="badge ${r.status === 'paid' ? 'bg-success' : 'bg-warning'}">${r.status === 'paid' ? 'پرداخت شده' : 'در انتظار'}</span>
                            </div>
                            <small>تاریخ: ${r.receiptDate} | ساعت: ${r.receiptTime}</small>
                        </div>
                        <div class="detail-row">
                            <span>مشتری:</span>
                            <span class="fw-bold">${r.customerName} (کد: ${r.customerCode})</span>
                        </div>
                        <div class="detail-row">
                            <span>پرداخت کننده:</span>
                            <span>${r.payerName}</span>
                        </div>
                        <div class="detail-row">
                            <span>مبلغ:</span>
                            <span class="amount-positive">${r.totalAmount.toLocaleString()} ${r.currency}</span>
                        </div>
                        <div class="detail-row">
                            <span>نرخ تبدیل:</span>
                            <span>${r.exchangeRate}</span>
                        </div>
                        <div class="detail-row">
                            <span>حساب سابقه:</span>
                            <span>${r.previousBalance.toLocaleString()} ${r.currency}</span>
                        </div>
                        <div class="detail-row">
                            <span>طلب جاری:</span>
                            <span>${r.demandAmount.toLocaleString()} ${r.currency}</span>
                        </div>
                        ${r.description ? `
                        <div class="detail-row mt-2 text-muted small">
                            <span>توضیحات:</span>
                            <span>${r.description}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function saveReceipt() {
            const newReceipt = {
                id: Date.now(),
                receiptNumber: document.getElementById('receiptNumber').value,
                receiptDate: document.getElementById('receiptDate').value,
                receiptTime: new Date().toLocaleTimeString('fa-IR'),
                customerCode: document.getElementById('customerCode').value,
                customerName: document.getElementById('customerNameReceipt').value,
                payerName: document.getElementById('payerName').value,
                payerAddress: document.getElementById('payerAddress').value,
                currency: document.getElementById('currency').value,
                exchangeRate: parseFloat(document.getElementById('exchangeRate').value),
                exchangeAmount: parseFloat(document.getElementById('totalAmount').value),
                previousBalance: 0,
                demandAmount: 0,
                discountAmount: 0,
                totalAmount: parseFloat(document.getElementById('totalAmount').value),
                amountInWords: "",
                description: document.getElementById('descriptionReceipt').value,
                status: "paid"
            };

            receiptsData.unshift(newReceipt);
            renderReceipts();
            bootstrap.Modal.getInstance(document.getElementById('receiptModal')).hide();
            document.getElementById('receiptForm').reset();
            showToast('رسید با موفقیت ثبت شد', 'success');
        }

        document.getElementById('saveReceiptBtn')?.addEventListener('click', saveReceipt);
        document.getElementById('resetReceiptFilters')?.addEventListener('click', () => {
            document.getElementById('searchReceipt').value = '';
            document.getElementById('filterDate').value = '';
            document.getElementById('filterStatus').value = 'all';
            renderReceipts();
        });

        loadSidebarAndNavbar('receipts');
        renderReceipts();
    </script>
</body>
</html>
