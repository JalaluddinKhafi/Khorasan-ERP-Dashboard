<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاکتور فروش | مدیریت جامع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        @media print {
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            .no-print, .sidebar, .top-navbar, .btn, .action-buttons {
                display: none !important;
            }
            .invoice-container {
                padding: 0 !important;
                margin: 0 !important;
            }
            .invoice-box {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
        }
        
        .invoice-box {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        
        /* Header شرکت با لوگو */
        .invoice-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 1.5rem;
            position: relative;
        }
        
        .company-logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .company-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #1e293b;
        }
        
        .company-info h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .company-info p {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 0.25rem;
        }
        
        .invoice-title {
            text-align: left;
            border-right: 2px solid rgba(255,255,255,0.3);
            padding-right: 1rem;
        }
        
        .invoice-title h3 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        /* بخش اطلاعات */
        .info-section {
            padding: 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .info-box {
            background: white;
            border-radius: 0.75rem;
            padding: 1rem;
            height: 100%;
            box-shadow: var(--shadow-sm);
        }
        
        .info-box h6 {
            color: var(--gray);
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }
        
        .info-box p {
            margin-bottom: 0;
            font-weight: 500;
        }
        
        /* جدول محصولات */
        .items-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .items-table th {
            background: #f1f5f9;
            padding: 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .items-table td {
            padding: 0.75rem;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

    <script src="../assets/js/theme.js"></script>

  </head>
  <body data-page="sales-invoice">
    <aside id="sidebar" class="sidebar" aria-label="فهرست مدیریت"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
