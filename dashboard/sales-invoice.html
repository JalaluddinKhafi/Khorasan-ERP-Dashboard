    <script src="../assets/js/components.js"></script>
    <script>
        // تابع تبدیل عدد به حروف
        function numberToWords(num) {
            const units = ["", "یک", "دو", "سه", "چهار", "پنج", "شش", "هفت", "هشت", "نه"];
            const tens = ["", "ده", "بیست", "سی", "چهل", "پنجاه", "شصت", "هفتاد", "هشتاد", "نود"];
            const hundreds = ["", "یکصد", "دویست", "سیصد", "چهارصد", "پانصد", "ششصد", "هفتصد", "هشتصد", "نهصد"];
            
            if (num === 0) return "صفر تومان";
            
            let word = "";
            if (num >= 1000000) {
                word += numberToWords(Math.floor(num / 1000000)) + " میلیون ";
                num %= 1000000;
            }
            if (num >= 1000) {
                word += numberToWords(Math.floor(num / 1000)) + " هزار ";
                num %= 1000;
            }
            if (num >= 100) {
                word += hundreds[Math.floor(num / 100)] + " ";
                num %= 100;
            }
            if (num >= 20) {
                word += tens[Math.floor(num / 10)] + " ";
                num %= 10;
            }
            if (num > 0 && num < 10) {
                word += units[num] + " ";
            }
            return word.trim() + " تومان";
        }

        // داده‌های نمونه فاکتور
        const invoiceData = {
            invoiceNo: "INV-1402-001",
            invoiceDate: "۱۴۰۲/۱۲/۰۵",
            dueDate: "۱۴۰۳/۰۱/۰۵",
            customer: {
                name: "آرمان پوراحمد",
                phone: "۰۹۱۲۱۲۳۴۵۶۷",
                address: "تهران، خیابان انقلاب، پلاک ۴۵"
            },
            items: [
                { row: 1, code: "P1001", name: "لپ تاپ ایسوس ROG", quantity: 1, unit: "عدد", price: 35500000, discount: 0, total: 35500000 },
                { row: 2, code: "P1003", name: "هدفون سونی WH-1000XM5", quantity: 2, unit: "عدد", price: 8900000, discount: 500000, total: 17300000 },
                { row: 3, code: "P1005", name: "موس بی سیم لاجیتک", quantity: 3, unit: "عدد", price: 2500000, discount: 0, total: 7500000 }
            ],
            paymentMethod: "نقدی / کارت به کارت"
        };

        function renderInvoice() {
            // اطلاعات پایه
            document.getElementById('invoiceNo').innerText = invoiceData.invoiceNo;
            document.getElementById('invoiceDate').innerText = invoiceData.invoiceDate;
            document.getElementById('invoiceNumberDisplay').innerText = invoiceData.invoiceNo;
            document.getElementById('issueDate').innerText = invoiceData.invoiceDate;
            document.getElementById('dueDate').innerText = invoiceData.dueDate;
            document.getElementById('paymentMethod').innerText = invoiceData.paymentMethod;
            
            // اطلاعات مشتری
            document.getElementById('customerName').innerText = invoiceData.customer.name;
            document.getElementById('customerPhone').innerText = invoiceData.customer.phone;
            document.getElementById('customerAddress').innerText = invoiceData.customer.address;
            
            // آیتم‌ها
            const tbody = document.getElementById('invoiceItemsBody');
            let subTotal = 0;
            let discountTotal = 0;
            
            tbody.innerHTML = invoiceData.items.map(item => {
                subTotal += item.total;
                discountTotal += item.discount;
                return `
                    <tr>
                        <td>${item.row}</td>
                        <td>${item.code}</td>
                        <td>${item.name}</td>
                        <td>${item.quantity}</td>
                        <td>${item.unit}</td>
                        <td>${item.price.toLocaleString()}</td>
                        <td class="text-danger">${item.discount.toLocaleString()}</td>
                        <td class="fw-bold">${item.total.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
            
            // محاسبات مالی
            const tax = Math.round((subTotal - discountTotal) * 0.09);
            const grandTotal = subTotal - discountTotal + tax;
            
            document.getElementById('subTotal').innerHTML = subTotal.toLocaleString() + ' تومان';
            document.getElementById('discountTotal').innerHTML = discountTotal.toLocaleString() + ' تومان';
            document.getElementById('taxTotal').innerHTML = tax.toLocaleString() + ' تومان';
            document.getElementById('grandTotal').innerHTML = grandTotal.toLocaleString() + ' تومان';
            document.getElementById('amountInWords').innerHTML = numberToWords(grandTotal);
        }

        function printInvoice() {
            window.print();
        }

        function downloadPDF() {
            showToast('در حال آماده‌سازی PDF...', 'info');
            // در حالت واقعی، می‌توان از کتابخانه‌هایی مثل html2pdf.js استفاده کرد
            // html2pdf().from(document.getElementById('invoiceContent')).save();
        }

        function shareInvoice() {
            showToast('لینک فاکتور کپی شد', 'success');
        }

        document.getElementById('printInvoiceBtn')?.addEventListener('click', printInvoice);
        document.getElementById('downloadInvoiceBtn')?.addEventListener('click', downloadPDF);
        document.getElementById('shareInvoiceBtn')?.addEventListener('click', shareInvoice);

        loadSidebarAndNavbar('sales');
        renderInvoice();
    </script>
