<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت خرید | خراسان سیستم</title>
    <link href="../assets/vendor/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/all.min.css">
    <link rel="stylesheet" href="../assets/vendor/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .items-table th, .items-table td {
            vertical-align: middle;
            text-align: center;
        }
        .items-table .form-control {
            font-size: 0.8rem;
            padding: 0.3rem 0.5rem;
        }
        .row-total {
            font-weight: 700;
            color: #2563eb;
        }
        .total-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2563eb;
        }
    </style>
    <script src="../assets/js/frontend-store.js"></script>
    <script src="../assets/js/demo-data.js"></script>
    <script src="../assets/js/organization.js"></script>
    <script src="../assets/js/persian.js"></script>
    <script src="../assets/js/utils.js"></script>
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- کارت آمار -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary"><i class="fas fa-shopping-cart"></i></div>
                            <div class="stat-info">
                                <h3 id="totalPurchases">0</h3>
                                <p>کل فاکتورها</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-success"><i class="fas fa-dollar-sign"></i></div>
                            <div class="stat-info">
                                <h3 id="totalAmount">0</h3>
                                <p>کل مبلغ خرید</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-warning"><i class="fas fa-clock"></i></div>
                            <div class="stat-info">
                                <h3 id="pendingCount">0</h3>
                                <p>در انتظار پرداخت</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-info"><i class="fas fa-check-circle"></i></div>
                            <div class="stat-info">
                                <h3 id="paidCount">0</h3>
                                <p>پرداخت شده</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- لیست فاکتورها -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5><i class="fas fa-list"></i> لیست فاکتورهای خرید</h5>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#purchaseModal">
                            <i class="fas fa-plus"></i> فاکتور خرید جدید
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3 g-2">
                            <div class="col-md-3">
                                <input type="text" id="searchPurchase" class="form-control" placeholder="جستجو...">
                            </div>
                            <div class="col-md-3">
                                <select id="statusFilter" class="form-select">
                                    <option value="all">همه وضعیت‌ها</option>
                                    <option value="پرداخت شده">پرداخت شده</option>
                                    <option value="پرداخت جزئی">پرداخت جزئی</option>
                                    <option value="پرداخت نشده">پرداخت نشده</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="text" id="dateFilter" class="form-control" placeholder="فیلتر تاریخ">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-secondary w-100" id="resetFilters">
                                    <i class="fas fa-undo"></i> حذف فیلتر
                                </button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="purchasesTable">
                                <thead>
                                    <tr>
                                        <th>شماره فاکتور</th>
                                        <th>تامین‌کننده</th>
                                        <th>تاریخ</th>
                                        <th>مبلغ کل</th>
                                        <th>پرداخت شده</th>
                                        <th>باقیمانده</th>
                                        <th>وضعیت</th>
                                        <th>عملیات</th>
                                    </tr>
                                </thead>
                                <tbody id="purchasesTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal فاکتور -->
    <div class="modal fade" id="purchaseModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">ایجاد فاکتور خرید</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="purchaseForm">
                        <input type="hidden" id="purchaseId">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label>شماره فاکتور</label>
                                <input type="text" id="invoiceNo" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label>تاریخ</label>
                                <input type="text" id="invoiceDate" class="form-control" placeholder="1405/03/12" required>
                            </div>
                            <div class="col-md-4">
                                <label>تامین‌کننده</label>
                                <select id="supplierSelect" class="form-select" required>
                                    <option value="">انتخاب کنید</option>
                                    <option value="توزیع کننده البرز">توزیع کننده البرز</option>
                                    <option value="واردات سامسونگ">واردات سامسونگ</option>
                                    <option value="بازرگانی نوین">بازرگانی نوین</option>
                                </select>
                            </div>
                        </div>

                        <h6>اقلام خرید</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered items-table" id="itemsTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>کالا</th>
                                        <th>تعداد</th>
                                        <th>واحد</th>
                                        <th>قیمت واحد</th>
                                        <th>تخفیف</th>
                                        <th>مجموع</th>
                                        <th>
                                            <button type="button" class="btn btn-sm btn-success" id="addItemRow">
                                                <i class="fas fa-plus"></i>
                                            </button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="itemsBody">
                                    <tr>
                                        <td><input type="text" class="form-control product-name" placeholder="نام کالا"></td>
                                        <td><input type="number" class="form-control quantity" value="1" min="1" step="any"></td>
                                        <td><input type="text" class="form-control unit" value="عدد"></td>
                                        <td><input type="number" class="form-control unit-price" value="0" min="0" step="any"></td>
                                        <td><input type="number" class="form-control discount" value="0" min="0" step="any"></td>
                                        <td class="row-total">0</td>
                                        <td><button type="button" class="btn btn-sm btn-danger remove-row"><i class="fas fa-trash"></i></button></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr><th colspan="5" class="text-end">جمع کل:</th><th id="grandTotal">0</th><th></th></tr>
                                </tfoot>
                            </table>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label>مبلغ پرداختی</label>
                                <input type="number" id="paidAmount" class="form-control" value="0" min="0" step="any">
                            </div>
                            <div class="col-md-6">
                                <label>وضعیت</label>
                                <select id="paymentStatus" class="form-select">
                                    <option value="پرداخت نشده">پرداخت نشده</option>
                                    <option value="پرداخت جزئی">پرداخت جزئی</option>
                                    <option value="پرداخت شده">پرداخت شده</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label>توضیحات</label>
                            <textarea id="description" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                    <button type="button" class="btn btn-primary" id="savePurchaseBtn">ذخیره</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal جزئیات -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">جزئیات فاکتور</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailsContent"></div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">بستن</button>
                    <button class="btn btn-primary" id="printDetailsBtn">چاپ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
    <script src="../assets/vendor/jquery-3.6.0.min.js"></script>
    <script src="../assets/vendor/jquery.dataTables.min.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        // داده‌های نمونه
        let purchasesData = FrontendStore.read('purchases', DemoData.purchases);

        let purchasesTable = null;

        function initDataTable() {
            

            $('#purchasesTable').off('draw.dt.khorasan').on('draw.dt.khorasan', attachEvents);
            purchasesTable = $('#purchasesTable').DataTable({
                language: {
                    "emptyTable": "هیچ داده‌ای وجود ندارد",
                    "info": "نمایش _START_ تا _END_ از _TOTAL_ رکورد",
                    "infoEmpty": "نمایش 0 تا 0 از 0 رکورد",
                    "search": "جستجو:",
                    "paginate": { "first": "اولین", "last": "آخرین", "next": "بعدی", "previous": "قبلی" }
                },
                pageLength: 10,
                searching: false,
                destroy: true
            });
        }

        function renderPurchasesTable(rows = purchasesData) {
            FrontendStore.write('purchases', purchasesData);
            destroyDataTable('purchasesTable');
            const tbody = document.getElementById('purchasesTableBody');
            tbody.innerHTML = rows.map(p => `
                <tr>
                    <td>${escapeHTML(p.invoiceNo)}</td>
                    <td>${escapeHTML(p.supplier)}</td>
                    <td>${escapeHTML(p.date)}</td>
                    <td>${p.total.toLocaleString()} تومان</td>
                    <td>${p.paid.toLocaleString()} تومان</td>
                    <td class="${p.remaining > 0 ? 'text-danger' : 'text-success'}">${p.remaining.toLocaleString()} تومان</td>
                    <td><span class="badge ${p.status === 'پرداخت شده' ? 'bg-success' : (p.status === 'پرداخت جزئی' ? 'bg-warning' : 'bg-danger')}">${escapeHTML(p.status)}</span></td>
                    <td>
                        <button class="btn btn-sm btn-info view-purchase" data-id="${p.id}"><i class="fas fa-eye"></i></button>
                        <button class="btn btn-sm btn-primary edit-purchase" data-id="${p.id}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger delete-purchase" data-id="${p.id}"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
            
            initDataTable();
            attachEvents();
            calculateStats();
        }

        function attachEvents() {
            document.querySelectorAll('.view-purchase').forEach(btn => {
                btn.onclick = () => viewPurchase(parseInt(btn.dataset.id));
            });
            document.querySelectorAll('.edit-purchase').forEach(btn => {
                btn.onclick = () => editPurchase(parseInt(btn.dataset.id));
            });
            document.querySelectorAll('.delete-purchase').forEach(btn => {
                btn.onclick = () => deletePurchase(parseInt(btn.dataset.id));
            });
        }

        function calculateStats() {
            document.getElementById('totalPurchases').innerHTML = purchasesData.length;
            document.getElementById('totalAmount').innerHTML = purchasesData.reduce((s, p) => s + p.total, 0).toLocaleString() + ' تومان';
            document.getElementById('pendingCount').innerHTML = purchasesData.filter(p => p.status !== 'پرداخت شده').length;
            document.getElementById('paidCount').innerHTML = purchasesData.filter(p => p.status === 'پرداخت شده').length;
        }

        function filterPurchases() {
            const search = document.getElementById('searchPurchase').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const date = document.getElementById('dateFilter').value;
            
            const filtered = purchasesData.filter(p => {
                const matchSearch = p.invoiceNo.toLowerCase().includes(search) || p.supplier.toLowerCase().includes(search);
                const matchStatus = status === 'all' || p.status === status;
                const matchDate = !date || p.date.includes(date);
                return matchSearch && matchStatus && matchDate;
            });
            renderPurchasesTable(filtered);
        }

        function calculateItemTotal() {
            let total = 0;
            document.querySelectorAll('#itemsBody tr').forEach(row => {
                const qty = parseFloat(row.querySelector('.quantity')?.value) || 0;
                const price = parseFloat(row.querySelector('.unit-price')?.value) || 0;
                const discount = parseFloat(row.querySelector('.discount')?.value) || 0;
                const sum = (qty * price) - discount;
                row.querySelector('.row-total').innerHTML = sum.toLocaleString();
                total += sum;
            });
            document.getElementById('grandTotal').innerHTML = total.toLocaleString();
        }

        function addItemRow() {
            destroyDataTable('itemsTable');
            const tbody = document.getElementById('itemsBody');
            tbody.insertAdjacentHTML('beforeend', `
                <tr>
                    <td><input type="text" class="form-control product-name" placeholder="نام کالا"></td>
                    <td><input type="number" class="form-control quantity" value="1" min="1" step="any"></td>
                    <td><input type="text" class="form-control unit" value="عدد"></td>
                    <td><input type="number" class="form-control unit-price" value="0" min="0" step="any"></td>
                    <td><input type="number" class="form-control discount" value="0" min="0" step="any"></td>
                    <td class="row-total">0</td>
                    <td><button type="button" class="btn btn-sm btn-danger remove-row"><i class="fas fa-trash"></i></button></td>
                </tr>
            `);
            attachRowEvents();
        }

        function attachRowEvents() {
            document.querySelectorAll('.quantity, .unit-price, .discount').forEach(el => {
                el.oninput = () => calculateItemTotal();
            });
            document.querySelectorAll('.remove-row').forEach(btn => {
                btn.onclick = function() {
                    if (document.querySelectorAll('#itemsBody tr').length > 1) {
                        this.closest('tr').remove();
                        calculateItemTotal();
                    }
                };
            });
        }

        function savePurchase() {
            if (!validateForm('purchaseForm')) return;
            if(!dateInputValue(document.getElementById('invoiceDate').value)){showToast('تاریخ نامعتبر است','error');return;}
            calculateItemTotal();
            const total = parseAmount(document.getElementById('grandTotal').textContent) || 0;
            const paid = Number(document.getElementById('paidAmount').value) || 0;
            const status = paid === 0 ? 'پرداخت نشده' : (paid >= total ? 'پرداخت شده' : 'پرداخت جزئی');
            
            const items = [];
            document.querySelectorAll('#itemsBody tr').forEach(row => {
                items.push({
                    product: row.querySelector('.product-name')?.value,
                    qty: parseFloat(row.querySelector('.quantity')?.value),
                    unit: row.querySelector('.unit')?.value,
                    price: parseFloat(row.querySelector('.unit-price')?.value),
                    discount: parseFloat(row.querySelector('.discount')?.value),
                    total: (parseFloat(row.querySelector('.quantity')?.value) * parseFloat(row.querySelector('.unit-price')?.value)) - parseFloat(row.querySelector('.discount')?.value)
                });
            });
            
            const newPurchase = {
                id: Number(document.getElementById('purchaseId').value) || Date.now(),
                invoiceNo: document.getElementById('invoiceNo').value,
                supplier: document.getElementById('supplierSelect').value,
                date: document.getElementById('invoiceDate').value,
                total: total,
                paid: paid,
                remaining: total - paid,
                status: status,
                items: items,
                description: document.getElementById('description').value,
                stockApplied: true
            };
            
            const editingId = Number(document.getElementById('purchaseId').value);
            if (!items.length || items.some(i=>!i.product?.trim() || !Number.isFinite(i.qty) || i.qty<=0 || !Number.isFinite(i.price) || i.price<0 || !Number.isFinite(i.discount) || i.discount<0 || i.discount>i.qty*i.price) || paid<0 || paid>total) {
                showToast('لطفاً اطلاعات فاکتور را صحیح وارد کنید','error'); return;
            }
            if (purchasesData.some(p=>p.invoiceNo===newPurchase.invoiceNo && p.id!==editingId)) {showToast('شماره فاکتور تکراری است','error');return;}
            const products = FrontendStore.read('products',DemoData.products);
            const previous = purchasesData.find(p=>p.id===editingId);
            const stockChanges = new Map();
            (previous?.stockApplied ? previous.items : []).forEach(i=>stockChanges.set(i.product,(stockChanges.get(i.product)||0)-i.qty));
            items.forEach(i=>stockChanges.set(i.product,(stockChanges.get(i.product)||0)+i.qty));
            for(const [name,change] of stockChanges) {
                let product = products.find(p=>p.name===name);
                if(!product && change>0) {
                    product={id:Date.now()+products.length,code:'P-'+Date.now()+'-'+products.length,name,category:'نامشخص',unit:items.find(i=>i.product===name)?.unit || 'عدد',purchasePrice:items.find(i=>i.product===name)?.price || 0,salePrice:items.find(i=>i.product===name)?.price || 0,stock:0,minStock:0,status:'موجود',description:'',image:''}; products.push(product);
                }
                if(product) { if(product.stock+change<0) {showToast('موجودی کالا کافی نیست','error');return;} product.stock+=change; product.lastIn=newPurchase.date; }
            }
            const next = editingId ? purchasesData.map(p=>p.id===editingId ? newPurchase : p) : [...purchasesData,newPurchase];
            const stockTransactions=FrontendStore.read('stockTransactions',[]);
            for(const [name,change] of stockChanges) if(change) stockTransactions.push({date:newPurchase.date,type:change>0?'ورود':'خروج',product:name,quantity:Math.abs(change),ref:newPurchase.invoiceNo,user:'admin'});
            const suppliers=FrontendStore.read('suppliers',DemoData.suppliers);
            if(previous) {const old=suppliers.find(s=>s.name===previous.supplier);if(old)old.debt=Math.max(0,(old.debt || 0)-previous.remaining);}
            const supplier=suppliers.find(s=>s.name===newPurchase.supplier);
            if(supplier)supplier.debt=(supplier.debt || 0)+newPurchase.remaining;
            FrontendStore.writeMany({purchases:next,products,stockTransactions,suppliers});
            purchasesData = next;
            renderPurchasesTable();
            bootstrap.Modal.getInstance(document.getElementById('purchaseModal')).hide();
            document.getElementById('purchaseForm').reset();
            showToast('فاکتور با موفقیت ثبت شد', 'success');
        }

        function viewPurchase(id) {
            const p = purchasesData.find(x => x.id === id);
            if (!p) return;
            
            document.getElementById('detailsContent').innerHTML = `
                <p><strong>شماره:</strong> ${escapeHTML(p.invoiceNo)}</p>
                <p><strong>تامین‌کننده:</strong> ${escapeHTML(p.supplier)}</p>
                <p><strong>تاریخ:</strong> ${escapeHTML(p.date)}</p>
                <p><strong>مبلغ کل:</strong> ${p.total.toLocaleString()} تومان</p>
                <p><strong>پرداختی:</strong> ${p.paid.toLocaleString()} تومان</p>
                <p><strong>باقیمانده:</strong> ${p.remaining.toLocaleString()} تومان</p>
                <p><strong>وضعیت:</strong> ${escapeHTML(p.status)}</p>
                ${p.description ? `<p><strong>توضیحات:</strong> ${escapeHTML(p.description)}</p>` : ''}
            `;
            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }

        function editPurchase(id) {
            const purchase=purchasesData.find(p=>p.id===id);
            if(!purchase)return;
            document.getElementById('purchaseId').value=id;
            document.getElementById('invoiceNo').value=purchase.invoiceNo;
            document.getElementById('invoiceDate').value=purchase.date;
            document.getElementById('supplierSelect').value=purchase.supplier;
            document.getElementById('paidAmount').value=purchase.paid;
            document.getElementById('description').value=purchase.description || '';
            document.getElementById('itemsBody').replaceChildren();
            purchase.items.forEach(item=>{
                addItemRow(); const row=document.querySelector('#itemsBody tr:last-child');
                row.querySelector('.product-name').value=item.product;
                row.querySelector('.quantity').value=item.qty;
                row.querySelector('.unit').value=item.unit;
                row.querySelector('.unit-price').value=item.price;
                row.querySelector('.discount').value=item.discount;
            });
            calculateItemTotal();
            new bootstrap.Modal(document.getElementById('purchaseModal')).show();
        }

        function deletePurchase(id) {
            if (confirm('آیا از حذف اطمینان دارید؟')) {
                const invoice=purchasesData.find(p=>p.id===id);
                const products=FrontendStore.read('products',DemoData.products);
                if(invoice?.stockApplied) {
                    const quantities=new Map();
                    invoice.items.forEach(i=>quantities.set(i.product,(quantities.get(i.product)||0)+i.qty));
                    for(const [name,qty] of quantities) {
                        const product=products.find(p=>p.name===name);
                        if(product && product.stock<qty){showToast('موجودی کالا کافی نیست','error');return;}
                        if(product)product.stock-=qty;
                    }
                }
                const next=purchasesData.filter(p=>p.id!==id);
                const stockTransactions=FrontendStore.read('stockTransactions',[]);
                if(invoice?.stockApplied)invoice.items.forEach(i=>stockTransactions.push({date:todayISO(),type:'خروج',product:i.product,quantity:i.qty,ref:invoice.invoiceNo,user:'admin'}));
                const suppliers=FrontendStore.read('suppliers',DemoData.suppliers);
                const supplier=suppliers.find(s=>s.name===invoice.supplier);
                if(supplier)supplier.debt=Math.max(0,(supplier.debt || 0)-invoice.remaining);
                FrontendStore.writeMany({purchases:next,products,stockTransactions,suppliers});
                purchasesData=next;
                renderPurchasesTable();
                showToast('فاکتور حذف شد', 'success');
            }
        }

        document.getElementById('purchaseModal').addEventListener('hidden.bs.modal',()=>{
            document.getElementById('purchaseId').value='';
            document.getElementById('itemsBody').replaceChildren(); addItemRow(); calculateItemTotal();
        });
        document.getElementById('purchaseModal').addEventListener('show.bs.modal',()=>{
            if(!document.getElementById('purchaseId').value && !document.querySelector('#itemsBody tr')) addItemRow();
        });
        // رویدادها
        document.getElementById('addItemRow')?.addEventListener('click', addItemRow);
        document.getElementById('savePurchaseBtn')?.addEventListener('click', savePurchase);
        document.getElementById('printDetailsBtn')?.addEventListener('click', () => window.print());
        document.getElementById('resetFilters')?.addEventListener('click', () => {
            document.getElementById('searchPurchase').value = '';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('dateFilter').value = '';
            filterPurchases();
        });
        document.getElementById('searchPurchase')?.addEventListener('keyup', filterPurchases);
        document.getElementById('statusFilter')?.addEventListener('change', filterPurchases);
        document.getElementById('dateFilter')?.addEventListener('keyup', filterPurchases);
        document.getElementById('paidAmount')?.addEventListener('input', function() {
            const total = parseInt(document.getElementById('grandTotal').innerHTML.replace(/,/g, '')) || 0;
            const paid = parseInt(this.value) || 0;
            const statusSelect = document.getElementById('paymentStatus');
            if (paid === 0) statusSelect.value = 'پرداخت نشده';
            else if (paid >= total) statusSelect.value = 'پرداخت شده';
            else statusSelect.value = 'پرداخت جزئی';
        });

        loadSidebarAndNavbar('purchases');
        renderPurchasesTable();
        attachRowEvents();
    </script>
</body>
</html>
