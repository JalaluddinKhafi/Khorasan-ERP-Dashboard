<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت خرید | خراسان سیستم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .items-table th, .items-table td {
            vertical-align: middle;
            text-align: center;
        }
        .items-table .form-control {
            font-size: 0.8rem;
            padding: 0.3rem 0.5rem;
        }
        .row-total {
            font-weight: 700;
            color: #2563eb;
        }
        .total-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- کارت آمار -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary"><i class="fas fa-shopping-cart"></i></div>
                            <div class="stat-info">
                                <h3 id="totalPurchases">0</h3>
                                <p>کل فاکتورها</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-success"><i class="fas fa-dollar-sign"></i></div>
                            <div class="stat-info">
                                <h3 id="totalAmount">0</h3>
                                <p>کل مبلغ خرید</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-warning"><i class="fas fa-clock"></i></div>
                            <div class="stat-info">
                                <h3 id="pendingCount">0</h3>
                                <p>در انتظار پرداخت</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-info"><i class="fas fa-check-circle"></i></div>
                            <div class="stat-info">
                                <h3 id="paidCount">0</h3>
                                <p>پرداخت شده</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- لیست فاکتورها -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5><i class="fas fa-list"></i> لیست فاکتورهای خرید</h5>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#purchaseModal">
                            <i class="fas fa-plus"></i> فاکتور خرید جدید
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3 g-2">
                            <div class="col-md-3">
                                <input type="text" id="searchPurchase" class="form-control" placeholder="جستجو...">
                            </div>
                            <div class="col-md-3">
                                <select id="statusFilter" class="form-select">
                                    <option value="all">همه وضعیت‌ها</option>
                                    <option value="پرداخت شده">پرداخت شده</option>
                                    <option value="پرداخت جزئی">پرداخت جزئی</option>
                                    <option value="پرداخت نشده">پرداخت نشده</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="text" id="dateFilter" class="form-control" placeholder="فیلتر تاریخ">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-secondary w-100" id="resetFilters">
                                    <i class="fas fa-undo"></i> حذف فیلتر
                                </button>
                            </div>
                        </div>

      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
