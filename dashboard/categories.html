<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت دسته‌بندی | داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <div class="row">
                    <div class="col-lg-5 mb-4">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between">
                                <h5>دسته‌بندی کالاها</h5>
                                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#categoryModal" id="addRootCategoryBtn">
                                    <i class="fas fa-plus"></i> افزودن دسته اصلی
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="categoryTree">
                                    <!-- درخت دسته‌بندی توسط JS پر می‌شود -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-header">
                                <h5>لیست تمام دسته‌بندی‌ها</h5>
                            </div>
                            <div class="card-body">
                                <table id="categoriesTable" class="table table-striped">
                                    <thead>
                                        <tr><th>شناسه</th><th>نام دسته</th><th>دسته والد</th><th>تعداد محصولات</th><th>عملیات</th></tr>
                                    </thead>
      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
