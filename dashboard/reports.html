<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گزارشات | داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .report-card {
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #e5e7eb;
        }
        .report-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #2563eb;
        }
        .date-range-picker {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Report Type Selection -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="daily-sales">
                            <i class="fas fa-chart-line fa-2x text-primary mb-2"></i>
                            <h6>گزارش فروش روزانه</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="monthly-sales">
                            <i class="fas fa-chart-bar fa-2x text-primary mb-2"></i>
                            <h6>گزارش فروش ماهانه</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="yearly-sales">
                            <i class="fas fa-chart-pie fa-2x text-primary mb-2"></i>
                            <h6>گزارش فروش سالانه</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="inventory">
                            <i class="fas fa-warehouse fa-2x text-primary mb-2"></i>
                            <h6>گزارش موجودی</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="debts">
                            <i class="fas fa-hand-holding-usd fa-2x text-primary mb-2"></i>
                            <h6>گزارش بدهی‌ها</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="expenses">
                            <i class="fas fa-file-invoice-dollar fa-2x text-primary mb-2"></i>
                            <h6>گزارش مصارف</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="profit-loss">
                            <i class="fas fa-chart-simple fa-2x text-primary mb-2"></i>
                            <h6>گزارش سود و زیان</h6>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="report-card card text-center p-3" data-report="purchases">
                            <i class="fas fa-shopping-cart fa-2x text-primary mb-2"></i>
                            <h6>گزارش خرید</h6>
                        </div>
                    </div>
                </div>

                <!-- Date Range Picker -->
                <div class="date-range-picker">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <label>از تاریخ:</label>
                            <input type="date" id="startDate" class="form-control" value="2024-01-01">
                        </div>
                        <div class="col-md-3">
                            <label>تا تاریخ:</label>
                            <input type="date" id="endDate" class="form-control" value="2024-01-31">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary mt-4" id="applyDateFilter">
                                <i class="fas fa-filter"></i> اعمال فیلتر
                            </button>
                        </div>
                        <div class="col-md-2">
      <header id="topbar" class="topbar"></header>
      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
