<body><div class="wrapper"><aside id="sidebar" class="sidebar"></aside><main class="main-content"><nav class="top-navbar"></nav><div class="container-fluid p-4"><div class="row g-3 mb-4"><div class="col-md-4"><div class="stat-card"><div class="stat-info"><h3 id="branchCount">۰</h3><p>نمایندگی‌ها</p></div></div></div><div class="col-md-4"><div class="stat-card"><div class="stat-info"><h3 id="activeBranchCount">۰</h3><p>نمایندگی‌های فعال</p></div></div></div></div><div class="card"><div class="card-header d-flex flex-wrap gap-2 justify-content-between"><h5>مدیریت نمایندگی‌ها</h5><button class="btn btn-primary" id="addBranchBtn"><i class="fas fa-plus"></i> ایجاد نمایندگی</button></div><div class="card-body"><div class="table-responsive"><table class="table table-striped" id="branchesTable"><thead><tr><th>کد</th><th>نام نمایندگی</th><th>ادمین</th><th>تماس</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="branchesBody"></tbody></table></div><p class="text-muted small">برای مدیریت فروش، خرید، مشتریان، کاربران و کارمندان یک نمایندگی، گزینهٔ مدیریت را انتخاب کنید.</p></div></div></div></main></div><div class="modal fade" id="branchModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>ایجاد / ویرایش نمایندگی</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="branchForm"><input type="hidden" id="branchId"><div class="mb-3"><label for="branchName" class="form-label">نام نمایندگی</label><input id="branchName" type="text" class="form-control" required></div><div class="mb-3"><label for="branchCode" class="form-label">کد نمایندگی</label><input id="branchCode" type="text" class="form-control" required></div><div class="mb-3"><label for="branchPhone" class="form-label">شماره تماس</label><input id="branchPhone" type="text" class="form-control" ></div><div class="mb-3"><label for="branchAddress" class="form-label">آدرس</label><input id="branchAddress" type="text"
