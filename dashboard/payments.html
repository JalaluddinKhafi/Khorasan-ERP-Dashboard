<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت پرداخت‌ها | داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Summary Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-success"><i class="fas fa-hand-holding-usd"></i></div>
                            <div class="stat-info">
                                <h3 id="totalReceived">۰</h3>
                                <p>کل دریافتی‌ها</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-danger"><i class="fas fa-money-bill-wave"></i></div>
                            <div class="stat-info">
                                <h3 id="totalPaid">۰</h3>
                                <p>کل پرداختی‌ها</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-warning"><i class="fas fa-clock"></i></div>
                            <div class="stat-info">
                                <h3 id="pendingPayments">۰</h3>
                                <p>پرداخت‌های در انتظار</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-info"><i class="fas fa-chart-line"></i></div>
                            <div class="stat-info">
                                <h3 id="netCashflow">۰</h3>
                                <p>جریان نقدی خالص</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#customerPayments">
                            <i class="fas fa-users"></i> پرداخت مشتریان
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#supplierPayments">
                            <i class="fas fa-truck"></i> پرداخت به تامین‌کنندگان
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#paymentHistory">
                            <i class="fas fa-history"></i> تاریخچه پرداخت‌ها
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- پرداخت مشتریان -->
                    <div class="tab-pane fade show active" id="customerPayments">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between">
                                <h5>لیست بدهی مشتریان</h5>
                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registerPaymentModal" onclick="setPaymentType('customer')">
                                    <i class="fas fa-plus"></i> ثبت دریافت جدید
                                </button>
                            </div>
                            <div class="card-body">
                                <table id="customerDebtsTable" class="table table-striped">
                                    <thead>
                                        <tr><th>مشتری</th><th>شماره تماس</th><th>مبلغ بدهی</th><th>تاریخ آخرین خرید</th><th>عملیات</th></tr>
                                    </thead>
                                    <tbody id="customerDebtsBody"></tbody>
                                </table>
                            </div>
                        </div>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
