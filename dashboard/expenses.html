<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت مصارف | داشبورد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Summary Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-danger"><i class="fas fa-chart-line"></i></div>
                            <div class="stat-info">
                                <h3 id="totalExpenses">۰</h3>
                                <p>کل مصارف ماه جاری</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-warning"><i class="fas fa-chart-pie"></i></div>
                            <div class="stat-info">
                                <h3 id="avgExpense">۰</h3>
                                <p>میانگین روزانه</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-info"><i class="fas fa-calendar"></i></div>
                            <div class="stat-info">
                                <h3 id="lastMonthExpense">۰</h3>
                                <p>ماه گذشته</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary"><i class="fas fa-trend-up"></i></div>
                            <div class="stat-info">
                                <h3 id="expenseChange">۰</h3>
                                <p>تغییر نسبت به ماه قبل</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between">
                                <h5>لیست مصارف</h5>
                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal">
                                    <i class="fas fa-plus"></i> ثبت مصرف جدید
                                </button>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <input type="text" id="searchExpense" class="form-control" placeholder="جستجو...">
                                    </div>
                                    <div class="col-md-3">
                                        <select id="categoryFilter" class="form-select">
                                            <option value="all">همه دسته‌بندی‌ها</option>
                                            <option value="کرایه">کرایه</option>
                                            <option value="معاش">معاش</option>
                                            <option value="برق">برق</option>
                                            <option value="حمل و نقل">حمل و نقل</option>
                                            <option value="سایر">سایر</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="text" id="dateRange" class="form-control" placeholder="محدوده تاریخ">
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
