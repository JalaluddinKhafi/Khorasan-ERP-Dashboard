<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران | داشبورد</title>
    <link href="../assets/vendor/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/all.min.css">
    <link rel="stylesheet" href="../assets/vendor/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/frontend-store.js"></script>
    <script src="../assets/js/demo-data.js"></script>
    <script src="../assets/js/organization.js"></script>
    <script src="../assets/js/persian.js"></script>
    <script src="../assets/js/utils.js"></script>
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h5>لیست کاربران سیستم</h5>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">
                            <i class="fas fa-plus"></i> افزودن کاربر جدید
                        </button>
                    </div>
                    <div class="card-body">
                        <table id="usersTable" class="table table-striped">
                            <thead>
                                <tr><th>شناسه</th><th>نام کاربری</th><th>نام و نام خانوادگی</th><th>نقش</th><th>ایمیل</th><th>وضعیت</th><th>آخرین ورود</th><th>عملیات</th></tr>
                            </thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal کاربر -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">افزودن/ویرایش کاربر</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3"><label for="userEmployee">کارمند مرتبط</label><select id="userEmployee" class="form-select"><option value="">بدون ارتباط</option></select></div>
                        <div class="mb-3">
                            <label>نام کاربری</label>
                            <input type="text" id="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>نام و نام خانوادگی</label>
                            <input type="text" id="fullname" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>ایمیل</label>
                            <input type="email" id="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>شماره تماس</label>
                            <input type="tel" id="phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>نقش کاربری</label>
                            <select id="role" class="form-select" required>
                                <option value="مدیر سیستم">مدیر سیستم</option>
                                <option value="کارمند">کارمند</option>
                                <option value="ناظر">ناظر</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>رمز عبور</label>
                            <input type="password" id="password" class="form-control" placeholder="در صورت ویرایش خالی بگذارید">
                        </div>
                        <div class="mb-3">
                            <label>وضعیت</label>
                            <select id="status" class="form-select">
                                <option value="فعال">فعال</option>
                                <option value="غیرفعال">غیرفعال</option>
                                <option value="مسدود">مسدود</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                    <div id="userError" class="text-danger me-auto" role="alert"></div><button type="button" class="btn btn-primary" id="saveUserBtn">ذخیره</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal حذف -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تایید حذف کاربر</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    آیا از حذف این کاربر اطمینان دارید؟
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteUserBtn">حذف</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
    <script src="../assets/vendor/jquery-3.6.0.min.js"></script>
    <script src="../assets/vendor/jquery.dataTables.min.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/users.js"></script>
</body>
</html>
