                                    <th>موجودی</th>
                                </tr>
                            </thead>
                            <tbody id="priceListBody"></tbody>
                            <tfoot class="table-secondary">
                                <tr>
                                    <th colspan="6" class="text-end">تعداد کل محصولات:</th>
                                    <th colspan="3" id="totalProductsCount">۰</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <button class="btn btn-primary print-btn no-print" id="fabPrintBtn">
        <i class="fas fa-print"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        // داده‌های محصولات
        const productsList = [
            { id: 1, code: "P1001", name: "لپ تاپ ایسوس ROG Zephyrus", category: "الکترونیک", purchasePrice: 28500000, salePrice: 35500000, unit: "عدد", stock: 45, image: "" },
            { id: 2, code: "P1002", name: "گوشی سامسونگ Galaxy S24 Ultra", category: "الکترونیک", purchasePrice: 38000000, salePrice: 42000000, unit: "عدد", stock: 8, image: "" },
            { id: 3, code: "P1003", name: "هدفون سونی WH-1000XM5", category: "الکترونیک", purchasePrice: 6500000, salePrice: 8900000, unit: "عدد", stock: 112, image: "" },
            { id: 4, code: "P1004", name: "تبلت اپل iPad Pro 12.9", category: "الکترونیک", purchasePrice: 42000000, salePrice: 48900000, unit: "عدد", stock: 3, image: "" },
            { id: 5, code: "P1005", name: "موس بی سیم لاجیتک MX Master 3", category: "الکترونیک", purchasePrice: 1850000, salePrice: 2500000, unit: "عدد", stock: 250, image: "" },
            { id: 6, code: "P1006", name: "کیبورد مکانیکال ریزر", category: "الکترونیک", purchasePrice: 3200000, salePrice: 4500000, unit: "عدد", stock: 34, image: "" },
            { id: 7, code: "P1007", name: "مانیتور سامسونگ 32 اینچ", category: "الکترونیک", purchasePrice: 12500000, salePrice: 15900000, unit: "عدد", stock: 12, image: "" }
        ];

        let priceTable = null;

        function renderPriceList() {
            const tbody = document.getElementById('priceListBody');
            if (!tbody) return;

            tbody.innerHTML = productsList.map((p, index) => `
                <tr class="price-row">
                    <td>${index + 1}</td>
                    <td>${p.code}</td>
                    <td><img src="${p.image || 'https://via.placeholder.com/40x40/e2e8f0/64748b?text=No'}" width="40" height="40" style="object-fit: cover; border-radius: 8px;"></td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>${p.purchasePrice.toLocaleString()}</td>
                    <td class="text-primary fw-bold">${p.salePrice.toLocaleString()}</td>
                    <td>${p.unit}</td>
                    <td class="${p.stock <= 10 ? 'text-danger fw-bold' : ''}">${p.stock}</td>
                </tr>
            `).join('');

            document.getElementById('totalProductsCount').innerHTML = productsList.length;

            if (priceTable) priceTable.destroy();
            priceTable = $('#priceListTable').DataTable({
                language: { url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/fa.json" },
                pageLength: 25,
                searching: false,
                ordering: true
            });
        }

        function filterPriceList() {
            const searchTerm = document.getElementById('searchProduct')?.value.toLowerCase() || '';
            const category = document.getElementById('categoryFilter')?.value || '';

            const filtered = productsList.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchTerm) || p.code.toLowerCase().includes(searchTerm);
                const matchCategory = !category || p.category === category;
                return matchSearch && matchCategory;
            });

            const tbody = document.getElementById('priceListBody');
            if (tbody) {
                tbody.innerHTML = filtered.map((p, index) => `
                    <tr class="price-row">
                        <td>${index + 1}</td>
                        <td>${p.code}</td>
                        <td><img src="${p.image || 'https://via.placeholder.com/40x40/e2e8f0/64748b?text=No'}" width="40" height="40" style="object-fit: cover; border-radius: 8px;"></td>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.purchasePrice.toLocaleString()}</td>
                        <td class="text-primary fw-bold">${p.salePrice.toLocaleString()}</td>
                        <td>${p.unit}</td>
                        <td class="${p.stock <= 10 ? 'text-danger fw-bold' : ''}">${p.stock}</td>
                    </tr>
                `).join('');
                document.getElementById('totalProductsCount').innerHTML = filtered.length;
            }

            if (priceTable) {
                priceTable.clear();
                priceTable.rows.add(filtered);
                priceTable.draw();
            }
        }

        function printPriceList() {
            window.print();
        }

        // تنظیم تاریخ امروز
        document.getElementById('printDate').innerText = new Date().toLocaleDateString('fa-IR');

        document.getElementById('searchProduct')?.addEventListener('keyup', filterPriceList);
        document.getElementById('categoryFilter')?.addEventListener('change', filterPriceList);
        document.getElementById('printPriceList')?.addEventListener('click', printPriceList);
        document.getElementById('fabPrintBtn')?.addEventListener('click', printPriceList);

        loadSidebarAndNavbar('products');
        renderPriceList();
    </script>
</body>
</html>
