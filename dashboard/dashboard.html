<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اصلی</title>
    <link href="../assets/vendor/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/dataTables.bootstrap5.min.css">
    <script src="../assets/vendor/jquery-3.6.0.min.js"></script>
    <script src="../assets/vendor/jquery.dataTables.min.js"></script>
    <script src="../assets/vendor/dataTables.bootstrap5.min.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/frontend-store.js"></script>
    <script src="../assets/js/demo-data.js"></script>
    <script src="../assets/js/organization.js"></script>
    <script src="../assets/js/persian.js"></script>
    <script src="../assets/js/utils.js"></script>
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Welcome Section with Quick Actions -->
                <div class="welcome-card">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h2><i class="fas fa-waveform"></i> خوش آمدید، ادمین گرامی!</h2>
                            <p class="mb-2">امروز <span id="todayDate"></span> - امیدواریم روز پرباری داشته باشید</p>
                            <div class="mt-3">
                                <button class="quick-action-btn" onclick="window.location.href='sales.html'">
                                    <i class="fas fa-plus"></i> فاکتور جدید
                                </button>
                                <button class="quick-action-btn" onclick="window.location.href='products.html'">
                                    <i class="fas fa-box"></i> افزودن کالا
                                </button>
                                <button class="quick-action-btn" onclick="window.location.href='reports.html'">
                                    <i class="fas fa-chart-bar"></i> مشاهده گزارشات
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4 text-center d-none d-md-block">
    <img src="../assets/images/logo.png" alt="لوگو" style="padding-left: 0; margin-left: 0;width: 150px; height: 100px; object-fit: contain;">
</div>
                    </div>
                </div>

                <!-- Statistics Cards Row 1 -->
                <div class="row g-4 mb-4" id="statsRow1">
                    <!-- دینامیک توسط JS پر می‌شود -->
                </div>

                <!-- Statistics Cards Row 2 -->
                <div class="row g-4 mb-4" id="statsRow2">
                    <!-- دینامیک توسط JS پر می‌شود -->
                </div>

                <!-- Top Products & Recent Activities Row -->
                <div class="row g-4 mb-4">
                    <div class="col-xl-5">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-trophy text-warning"></i> محصولات پرفروش</h5>
                            </div>
                            <div class="card-body">
                                <div id="topProductsList"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-7">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-clock text-info"></i> فعالیت‌های اخیر</h5>
                            </div>
                            <div class="card-body activity-timeline" id="activityTimeline">
                                <!-- توسط JS پر می‌شود -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Latest Invoices Row -->
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-file-invoice text-danger"></i> آخرین فاکتورهای فروش</h5>
                                <a href="sales.html" class="btn btn-sm btn-outline-primary">مشاهده همه</a>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-sm" id="latestSalesTable">
                                        <thead>
                                            <tr><th>شماره</th><th>مشتری</th><th>مبلغ</th><th>تاریخ</th><th>وضعیت</th></tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-file-invoice text-warning"></i> آخرین فاکتورهای خرید</h5>
                                <a href="purchases.html" class="btn btn-sm btn-outline-primary">مشاهده همه</a>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-sm" id="latestPurchasesTable">
                                        <thead>
                                            <tr><th>شماره</th><th>تامین‌کننده</th><th>مبلغ</th><th>تاریخ</th><th>وضعیت</th></tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Low Stock Alert Row -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card border-warning">
                            <div class="card-header bg-warning text-dark">
                                <h5><i class="fas fa-exclamation-triangle"></i> هشدار موجودی کالاها</h5>
                            </div>
                            <div class="card-body" id="lowStockAlert">
                                <!-- توسط JS پر می‌شود -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/dashboard-home.js"></script>
</body>
</html>
