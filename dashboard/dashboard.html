<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اصلی</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <nav class="top-navbar"></nav>
            <div class="container-fluid p-4">
                <!-- Welcome Section with Quick Actions -->
                <div class="welcome-card">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h2><i class="fas fa-waveform"></i> خوش آمدید، ادمین گرامی!</h2>
                            <p class="mb-2">امروز <span id="todayDate"></span> - امیدواریم روز پرباری داشته باشید</p>
                            <div class="mt-3">
                                <button class="quick-action-btn" onclick="window.location.href='sales.html'">
                                    <i class="fas fa-plus"></i> فاکتور جدید
                                </button>
                                <button class="quick-action-btn" onclick="window.location.href='products.html'">
                                    <i class="fas fa-box"></i> افزودن کالا
                                </button>
                                <button class="quick-action-btn" onclick="window.location.href='reports.html'">
                                    <i class="fas fa-chart-bar"></i> مشاهده گزارشات
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4 text-center d-none d-md-block">
    <img src="../assets/images/logo.png" alt="لوگو" style="padding-left: 0; margin-left: 0;width: 150px; height: 100px; object-fit: contain;">
</div>
                    </div>
                </div>

                <!-- Statistics Cards Row 1 -->
                <div class="row g-4 mb-4" id="statsRow1">
                    <!-- دینامیک توسط JS پر می‌شود -->
                </div>

                <!-- Statistics Cards Row 2 -->
                <div class="row g-4 mb-4" id="statsRow2">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>داشبورد | خراسان سیستم</title>
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/app.css" />
  </head>
  <body data-page="dashboard">
    <aside id="sidebar" class="sidebar" aria-label="فهرست مدیریت"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="app" aria-live="polite">
        <p class="loading">در حال دریافت اطلاعات…</p>
      </main>
    </div>
    <dialog id="editor">
      <header>
        <h2 id="editor-title"></h2>
        <button type="button" id="close-editor" aria-label="بستن">×</button>
      </header>
      <form id="editor-form">
        <div id="editor-fields" class="fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel-editor">انصراف</button
          ><button type="submit" class="primary">ذخیره</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
